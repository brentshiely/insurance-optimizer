<style>
:root{

  --fix:#A8322B; --fix-bg:#FBE4E1; --save:#9A6410; --save-bg:#FBF0DA;

    --accent:#4DC2AE; --accent-ink:#06211C; --accent-soft:#16332E;
    --fix:#F29088; --fix-bg:#3D1B18; --save:#F0BE62; --save-bg:#3A2C10;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;padding-inline:16px;padding-block:20px 48px}
[hidden]{display:none!important}
.shell{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.bar{height:4px;background:var(--line);border-radius:14px 14px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.pad{padding:26px;display:flex;flex-direction:column;gap:18px;min-height:420px}
@media (max-width:480px){.pad{padding:20px 18px}}
.caco{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:4px 2px 0;color:var(--muted)}
.caco svg{width:32px;height:32px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.caco span{display:block}
@media (max-width:480px){.caco{gap:10px 16px}.caco svg{width:26px;height:26px}}
h1{font-size:clamp(25px,5vw,32px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.why{font-size:14px;color:var(--muted)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opt{min-height:64px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:18px;font-weight:600;padding:10px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.foot{margin-top:auto;position:sticky;bottom:0;background:var(--surface);padding-block:14px 4px;border-top:1px solid var(--line)}
.usmap{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:520px}
.usmap button{aspect-ratio:1;min-width:0;padding:0;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.usmap button:hover{border-color:var(--accent);color:var(--accent)}
.usmap button.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
@media (max-width:480px){.usmap button{font-size:9px}}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.q{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q label,.q .ql{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;font-weight:600;font-size:15px;padding:6px 14px}
.seg button:hover{border-color:var(--accent)}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:13px;color:var(--accent);font-weight:600}
.group{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:6px 0 -6px}
.group.fix{color:var(--fix)} .group.save{color:var(--save)} .group.twice{color:var(--twice)} .group.ask{color:var(--ask)} .group.know{color:var(--know)}
.find{border-left:3px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.find.fix{border-color:var(--fix)} .find.save{border-color:var(--save)} .find.twice{border-color:var(--twice)} .find.ask{border-color:var(--ask)} .find.know{border-color:var(--know)}
.find b{font-size:16px;line-height:1.3}
.find .w{font-size:15px}
.find .todo{font-size:15px}
.find .todo strong{font-weight:700}
.find a{font-size:13px;color:var(--muted);text-underline-offset:3px;align-self:flex-start}
.find a:hover{color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details>summary{cursor:pointer;font-weight:700;color:var(--know);list-style-position:inside}
details[open]>summary{margin-bottom:14px}
details .stack{display:flex;flex-direction:column;gap:16px}
.more>summary{color:var(--accent)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 8px;font-weight:700;font-size:15px}
@media (max-width:440px){.actions{grid-template-columns:1fr}}
.status{min-height:20px;font-size:14px;color:var(--accent);font-weight:600;text-align:center}
.results{display:flex;flex-direction:column;gap:18px}
.debug{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13px}
.debug table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.debug td{padding:2px 0;border-bottom:1px solid var(--line)}
.debug td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  .bar,.foot,.actions,.status,.noprint,.debug,.caco{display:none!important}
  .card{border:0}
  .pad{padding:0;min-height:0}
  details{border:0;padding:0}
  details>summary{list-style:none}
  .find a::after{content:" (" attr(href) ")";word-break:break-all}
}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return "$"+Math.round(n).toLocaleString("en-US")}
function listWords(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+(a.length>2?",":"")+" and "+a[a.length-1]}
function lc(x){return x==="RV"||x==="ATV"?x:x.toLowerCase()}
function inList(l,v){return l.indexOf(v)>-1}
function owns(){return S.home==="Own"}
function rents(){return S.home==="Rent"}
function hasCar(){return S.car==="Yes"}
function relied(){return S.dep==="Yes"}
function water(){return S.extras.filter(function(x){return inList(WATERCRAFT,x)})}
function num(v){return typeof v==="number"?v:null}

/* ---------- what you have (screen 6) ---------- */
function haveList(){
  var st=S.state,l=[];
  if(owns()) l.push(["home","Home insurance"]);
  if(rents()){l.push(["rentMine","Renters insurance in my name"]);l.push(["rentOther","Renters insurance in someone else's name (like a roommate)"]);}
  if(owns()) l.push(["flood","Flood insurance"]);
  if(owns()&&inList(EQ_STATES,st)) l.push(["eq","Earthquake insurance"]);
  l.push(["umb","Umbrella policy (extra lawsuit protection)"]);
  l.push(["lifeWork","Life insurance through work"]);
  l.push(["lifeOwn","Life insurance of my own"]);
  if(relied()) l.push(["dis","Disability insurance (through work or my own)"]);
  l.push(["health","Health insurance"]);
  if(hasCar()) l.push(["club","AAA or another auto club"]);
  return l;
}
function has(k){return !!S.have[k]&&haveList().some(function(x){return x[0]===k})}

/* ---------- policy questions ---------- */
var YNS=[["Yes","Yes"],["No","No"],["ns","Not sure"]];
function autoQs(){
  var q=[{k:"collDed",label:"What's your collision deductible?",why:"It's what you pay before insurance pays for damage to your car.",
    opts:[[500,"$500 or less"],[1000,"$1,000"],[2000,"$2,000 or more"],["ns","Not sure"]]}];
  if(has("club")) q.push({k:"roadside",label:"Does your auto policy include roadside help or towing?",why:"You have an auto club, which already includes it.",opts:YNS});
  return q;
}
function homeQs(){
  var st=S.state,sn=stateName(st),q=[];
  q.push({k:"homeDed",label:"What's your deductible?",why:"It's what you pay before insurance pays on a claim.",
    opts:[[500,"$500"],[1000,"$1,000"],[2500,"$2,500"],[5000,"$5,000 or more"],["ns","Not sure"]]});
  q.push({k:"sewer",label:"Does it cover water backing up from a drain or sewer?",why:"Most policies leave it out unless you add it.",opts:YNS});
  var wind=inList(WINDSTATES,st),caEq=st==="CA"&&!has("eq");
  if(wind||caEq) q.push({k:"worth",label:"About what is your home worth?",why:"Some deductibles here are a percentage of your coverage, so we'll show them in dollars.",
    opts:[[250000,"$250,000"],[400000,"$400,000"],[600000,"$600,000"],[800000,"$800,000"],[1000000,"$1 million or more"],["ns","Not sure"]]});
  if(wind) q.push({k:"wind",label:"What's your hurricane or windstorm deductible?",why:"In "+sn+", it's usually a percentage of your coverage, not a flat amount.",
    opts:[[1,"1%"],[2,"2%"],[5,"5%"],[10,"10%"],["flat","A flat dollar amount"],["ns","Not sure"]]});
  if(PLAN[st]) q.push({k:"plan",label:"Is your home insured through "+PLAN[st]+"?",why:PLAN_SHORT[st]+" covers less than a regular policy.",opts:YNS});
  return q;
}
function homeSplit(){return homeQs().length>=4}
function toyQs(){
  var q=S.extras.map(function(x){
    return {k:"own_"+x,label:"Does your "+lc(x)+" have its own insurance policy?",opts:YNS};
  });
  var w=water();
  if(w.length&&w.some(function(x){var v=S.ans["own_"+x];return v==="No"||v==="ns"})){
    q.push({k:"boatVal",label:"About what would it cost to replace your "+listWords(w.map(lc)).replace(" and "," or ")+"?",why:"We'll show how much of it a home policy wouldn't pay.",
      opts:[[5000,"$5,000"],[15000,"$15,000"],[30000,"$30,000"],[60000,"$60,000 or more"],["ns","Not sure"]]});
  }
  return q;
}

/* ---------- screen order ---------- */
function order(){
  var o=["start","home","dep","car","motor","have"];
  if(hasCar()||has("home")) o.push("cushion");
  o.push("assets");
  if(hasCar()) o.push("auto");
  if(has("home")){o.push("home1"); if(homeSplit()) o.push("home2");}
  if(S.extras.length) o.push("toys");
  o.push("results");
  return o;
}

/* ---------- results ---------- */
function item(g,h,why,todo,src){var f={g:g,h:h,why:why,todo:todo||""}; if(src&&SRC[src]){f.src=SRC[src].src;f.url=SRC[src].url} return f}
function liveAns(){
  var qs=[],o={};
  if(hasCar()) qs=qs.concat(autoQs());
  if(has("home")) qs=qs.concat(homeQs());
  if(S.extras.length) qs=qs.concat(toyQs());
  qs.forEach(function(q){if(S.ans[q.k]!==undefined) o[q.k]=S.ans[q.k]});
  return o;
}
function findings(){
  var st=S.state,sn=stateName(st),a=liveAns(),out=[];
  var worth=num(a.worth),worthTxt=worth?"a home worth about "+money(worth):"";
  var cushionNo=S.cushion==="No",cushionYes=S.cushion==="Yes";
  var w=water(),mandate=BOAT_MANDATE_STATES[st];
  var wNo=w.filter(function(x){return a["own_"+x]==="No"});
  var wNs=w.filter(function(x){return a["own_"+x]==="ns"});
  var wYes=w.filter(function(x){return a["own_"+x]==="Yes"});
  var bv=num(a.boatVal);

  /* Fix first */
  if(wNo.length){
    var noun=listWords(wNo.map(lc)),are=wNo.length>1?"are":"is",isnt=wNo.length>1?"aren't":"isn't";
    out.push(item("fix","Your "+noun+" "+are+" barely covered.",
      "You said your "+noun+" "+isnt+" on "+(wNo.length>1?"their":"its")+" own policy"+(bv?" and would cost about "+money(bv)+" to replace":"")+". A home policy usually pays about $1,000 for boat damage.",
      "Get a boat insurance quote.","boatHome"));
    if(mandate){
      var jet=inList(wNo,"Jet ski");
      out.push(item("fix",sn+(jet?" requires insurance on your jet ski.":" may require insurance on your boat."),
        sn+" requires "+mandate.text+", and you said yours has no policy.",
        "Get a boat insurance quote that meets the state minimum.",mandate.src));
    }
  }
  if(a.own_Motorcycle==="No"&&st!=="FL")
    out.push(item("fix","Your motorcycle needs its own policy.","You said it isn't insured on its own. Every state but Florida requires liability insurance on a motorcycle.","Get a motorcycle insurance quote.","moto"));
  if(relied()&&has("lifeWork")&&!has("lifeOwn"))
    out.push(item("fix","Your life insurance ends with your job.","Someone relies on your income, and your only life insurance is through work. That coverage usually ends when the job does.","Price a term life policy of your own.","lifeWork"));
  if(relied()&&!has("lifeWork")&&!has("lifeOwn"))
    out.push(item("fix","No life insurance, and someone relies on you.","You said someone relies on your income and didn't mark any life insurance.","Price a term life policy."));
  if(relied()&&!has("dis")){
    var di=STATE_DI[st],diTxt="";
    if(di) diTxt=" "+sn+"'s "+di.name+" pays "+(di.amt?di.amt+(di.amt.indexOf(",")>-1?", ":" "):"")+"for "+di.dur+", then stops.";
    out.push(item("fix","Nothing replaces your pay if you can't work.","Someone relies on your income, and you didn't mark disability insurance."+diTxt,
      "Ask your employer about long-term disability coverage, or price a policy of your own.",di?di.src:null));
  }
  if(S.assets==="Yes"&&!has("umb"))
    out.push(item("fix","Your lawsuit protection may be low.","You said what you own comes to more than $300,000, and you didn't mark an umbrella policy.","Ask your agent what $1 million of umbrella coverage costs.","umbrella"));
  if(rents()&&!has("rentMine")&&!has("rentOther"))
    out.push(item("fix","Your landlord's insurance doesn't cover your things.","You rent and didn't mark renters insurance. A landlord's policy covers the building, not your belongings or your liability.","Get a renters insurance quote.","rentLandlord"));
  if(rents()&&has("rentOther")&&!has("rentMine"))
    out.push(item("fix","You may not be covered by that renters policy.","You said it's in someone else's name. A roommate or partner usually isn't covered unless they're named on the policy.","Ask to be added to it by name, or get your own.","rentNamed"));
  if(owns()&&!has("home"))
    out.push(item("fix","Your home has no insurance.","You own your home and didn't mark home insurance.","Get a home insurance quote."));
  if(a.sewer==="No")
    out.push(item("fix","Sewer backup isn't covered.","You said your home policy doesn't cover it. It's left out of most policies unless you add it, usually for $30 to $70 a year.","Ask your agent to add water backup coverage.","sewer"));
  var windSrc=st==="FL"?"windFL":"wind";
  if(num(a.wind)&&worth){
    var wd=worth*a.wind/100;
    if(cushionNo&&wd>2500)
      out.push(item("fix","A storm could cost you "+money(wd)+" first.","Your "+a.wind+"% hurricane deductible on "+worthTxt+" is about "+money(wd)+", and you said a $2,500 surprise would be hard.","Ask about a lower hurricane deductible.",windSrc));
    else
      out.push(item("know","Your hurricane deductible is about "+money(wd)+".","Your "+a.wind+"% hurricane deductible on "+worthTxt+" comes to about "+money(wd)+" before insurance pays.","",windSrc));
  }
  if(st==="CA"&&owns()&&!has("eq")){
    var eqWhy="California law requires your insurer to offer earthquake coverage. "+(worth?"On "+worthTxt+", a CEA policy's deductible would be "+money(worth*0.05)+" to "+money(worth*0.25)+".":"A CEA policy's deductible would be 5% to 25% of your coverage.")+" Without one, the rebuild is on you.";
    out.push(item("fix","Earthquakes aren't covered on your home.",eqWhy,"Ask your agent for an earthquake quote.","ceaDed"));
  }
  if(a.plan==="Yes"){
    if(st==="CA") out.push(item("fix","The FAIR Plan covers fire only.","You said your home is on the California FAIR Plan. Without a second policy, you have no theft, water, or liability coverage.","Ask about a \"difference in conditions\" policy.","caFair"));
    if(st==="TX") out.push(item("fix","TWIA covers only wind and hail.","You said your home is insured through TWIA. Fire, theft, and everything else need a separate policy.","Make sure you have a second policy for everything else.","twia"));
    if(st==="FL"&&worth&&worth>=800000) out.push(item("fix","Citizens may drop your home.","Citizens won't insure homes that cost $700,000 or more to rebuild, outside Miami-Dade and Monroe. You picked about "+money(worth)+".","Start shopping private insurers now.","flCitizens"));
    if(st==="FL"&&worth===600000) out.push(item("know","Your home is close to Citizens' limit.","Citizens won't insure homes that cost $700,000 or more to rebuild, outside Miami-Dade and Monroe. You picked about $600,000.","Check the rebuild cost at each renewal.","flCitizens"));
    if(st==="LA") out.push(item("know","Louisiana Citizens doesn't cover flood.","You said your home is insured through Louisiana Citizens. Flood needs its own policy.","","laCitizens"));
  }

  /* Could save */
  if(cushionYes){
    var lows=[],dsrc=null;
    if(num(a.collDed)===500){lows.push("a $500 collision deductible");dsrc="dedAuto"}
    if(num(a.homeDed)&&a.homeDed<=1000){lows.push("a "+money(a.homeDed)+" home deductible");dsrc="dedHome"}
    if(lows.length) out.push(item("save",lows.length>1?"Your deductibles may be lower than you need.":"Your deductible may be lower than you need.",
      "You picked "+listWords(lows)+(lows.length>1?",":"")+" and said you could cover a $2,500 surprise.","Get a quote with a higher deductible and compare the price.",dsrc));
  }
  if(S.dep==="No"&&has("lifeOwn"))
    out.push(item("save","You may not need that life policy.","You said no one relies on your income, and you have life insurance of your own.","Check whether you still need it before it renews."));

  /* Paying twice */
  if(a.roadside==="Yes"&&has("club"))
    out.push(item("twice","You may pay for towing twice.","You have an auto club, and you said your auto policy includes roadside help too.","Ask to remove roadside help from your auto policy."));

  /* Ask your agent */
  if(a.sewer==="ns") out.push(item("ask","Does my home policy cover sewer backup?","You weren't sure. It's left out of most policies unless you add it.","","sewer"));
  if(a.roadside==="ns"&&has("club")) out.push(item("ask","Does my auto policy include roadside help?","You weren't sure, and your auto club already covers it."));
  if(a.wind==="ns"){
    var wWhy=st==="FL"
      ? "In Florida, it's usually 2% to 10% of your coverage."+(worth?" On "+worthTxt+", that's "+money(worth*0.02)+" to "+money(worth*0.10)+".":"")
      : "In "+sn+", it's usually a percentage of your coverage."+(worth?" At 2%, you'd pay the first "+money(worth*0.02)+" on "+worthTxt+".":"");
    out.push(item("ask","What is my hurricane deductible in dollars?",wWhy,"",windSrc));
  }
  if(a.plan==="ns") out.push(item("ask","Am I on "+PLAN[st]+"?","You weren't sure. "+PLAN_SHORT[st]+" covers less than a regular policy.","",{CA:"caFair",FL:"flCitizens",TX:"twia",LA:"laCitizens"}[st]));
  if(wNs.length) out.push(item("ask","Is my "+listWords(wNs.map(lc))+" covered, and for how much?","You weren't sure. A home policy usually pays about $1,000 for boat damage.","","boatHome"));
  S.extras.forEach(function(x){
    if(inList(WATERCRAFT,x)) return;
    if(a["own_"+x]==="ns") out.push(item("ask","Is my "+lc(x)+" insured on its own policy?","You weren't sure. Home and auto policies cover very little of it."));
  });
  if(wYes.length) out.push(item("ask","Does my boat policy pay agreed value or actual cash value?","Actual cash value subtracts wear and age from a total-loss payout. Agreed value doesn't.","","boatIII"));
  if(has("umb")){
    var under=[];
    if(hasCar()) under.push("$250,000 of auto");
    if(owns()) under.push("$300,000 of home");
    var pols=[];if(hasCar())pols.push("auto");if(owns())pols.push("home");if(rents())pols.push("renters");
    out.push(item("ask","Do my "+(pols.length?listWords(pols)+" ":"")+"limits meet my umbrella's minimums?","You have an umbrella policy. "+(under.length?"Most insurers want about "+listWords(under)+" liability underneath":"Most insurers require certain liability limits underneath")+", or there's a gap it won't cover.","","umbrella"));
  }
  if(hasCar()&&has("health")&&!inList(NOFAULT,st)) out.push(item("ask","Do I need medical payments coverage if I have health insurance?","You have health insurance. Auto \"med pay\" can cover the same injuries.","","medpay"));
  if(hasCar()) out.push(item("ask","Is my uninsured motorist coverage as high as my liability coverage?","You drive. This pays for your injuries when the other driver has no insurance, and more than 1 in 7 drivers had none in 2023."+(inList(UM_MANDATORY_STATES,st)?" "+sn+" requires it but lets you pick the amount.":""),"","uninsured"));

  /* Good to know */
  if(hasCar()&&inList(NOFAULT,st)){
    var pm=PIP_MIN[st];
    out.push(item("know",sn+" requires injury coverage on every auto policy.","It's a no-fault state, so you can't drop it."+(pm?" The minimum is "+pm[0]+".":st==="MI"?" Michigan lets you choose a level.":""),"",pm?pm[1]:st==="MI"?"miPip":"nofault"));
  }
  if(owns()&&!has("flood"))
    out.push(item("know","Home insurance doesn't cover floods.","You own your home and didn't mark flood insurance. That's true everywhere, in a flood zone or not.","Check your flood risk and ask about a flood policy.","flood"));
  if(relied()&&has("dis")&&STATE_DI[st]){
    var d2=STATE_DI[st];
    out.push(item("know","Your state's paid leave fills only the first weeks.",sn+"'s "+d2.name+" covers "+d2.dur+". Check that your disability policy starts paying by then.","","ltdGap"));
  }
  if(owns()&&!has("eq")&&inList(EQ_STATES,st)&&st!=="CA"){
    if(inList(NEWMADRID_STATES,st))
      out.push(item("know","Earthquakes aren't covered by home insurance.",sn+" sits on the New Madrid seismic zone. Rebuilding after a quake would be out of pocket without separate coverage."+(st==="MO"?" In Missouri's most exposed counties, only about 1 home in 10 is covered.":""),"",st==="MO"?"moTakeup":"newMadrid"));
    else
      out.push(item("know","Earthquakes aren't covered by home insurance.",sn+" is one of 16 states USGS rates as having a higher chance of damaging shaking. A quake isn't covered without separate coverage.","","eqStates"));
  }
  if(a.own_RV==="No") out.push(item("know","A motorhome needs its own policy; a trailer partly rides on your car's.","A motorhome needs liability coverage that meets "+sn+"'s auto minimums. A towed trailer's damage to others is usually covered by your car's policy, but not damage to the trailer itself.","","rv"));
  if(a["own_E-bike"]==="No") out.push(item("know","An e-bike may not be covered while you're riding it.","A home or renters policy may cover it at home, but often not on the road, and usually with a low cap.","","ebike"));
  if(a.own_Motorcycle==="No"&&st==="FL") out.push(item("know","Florida doesn't require motorcycle insurance.","Nothing else you have covers you while riding, though.","","moto"));
  return out;
}

function findHTML(f){
  return '<div class="find '+f.g+'"><b>'+esc(f.h)+'</b><span class="w">'+esc(f.why)+'</span>'+
    (f.todo?'<span class="todo"><strong>What to do:</strong> '+esc(f.todo)+'</span>':'')+
    (f.url?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.src)+'</a>':'')+'</div>';
}
function grouped(list){
  var h="";
  GROUPS.forEach(function(g){
    var l=list.filter(function(f){return f.g===g[0]});
    if(l.length) h+='<p class="group '+g[0]+'">'+g[1]+'</p>'+l.map(findHTML).join("");
  });
  return h;
}
function countLine(all){
  var c=function(g){return all.filter(function(f){return f.g===g}).length};
  var parts=[],n;
  if((n=c("fix"))) parts.push(n+(n===1?" thing":" things")+" to fix");
  if((n=c("save"))) parts.push(n+(n===1?" way":" ways")+" to save");
  if((n=c("twice"))) parts.push(n+(n===1?" thing":" things")+" you may pay for twice");
  if((n=c("ask"))) parts.push(n+(n===1?" question":" questions")+" to ask");
  return parts.length?"Based on your answers: "+listWords(parts)+".":"";
}
function shareText(all){
  var lines=["My insurance checkup ("+stateName(S.state)+")",""];
  [["fix","FIX FIRST"],["save","COULD SAVE"],["twice","PAYING TWICE"],["ask","QUESTIONS FOR MY AGENT"],["know","GOOD TO KNOW"]].forEach(function(g){
    var l=all.filter(function(f){return f.g===g[0]});
    if(!l.length) return;
    lines.push(g[1]);
    l.forEach(function(f){lines.push("- "+f.h+(f.todo?" "+f.todo:""))});
    lines.push("");
  });
  lines.push("Made with Coverage Check: "+SITE);
  lines.push("General information, not insurance advice.");
  return lines.join("\n");
}

/* ---------- rendering ---------- */
function back(){return '<button class="link" data-act="back">Back</button>'}
function single(key,choices,cur){
  return '<div class="opts">'+choices.map(function(c){
    return '<button class="opt'+(cur===c[0]?' sel':'')+'" data-set="'+key+'" data-v="'+esc(c[0])+'">'+esc(c[1])+'</button>';
  }).join("")+'</div>';
}
function qBlock(q){
  var cur=S.ans[q.k];
  return '<div class="q"><span class="ql" id="ql_'+esc(q.k)+'">'+esc(q.label)+'</span>'+
    '<div class="seg" role="group" aria-labelledby="ql_'+esc(q.k)+'">'+q.opts.map(function(o){
      return '<button class="'+(cur===o[0]?'sel':'')+'" aria-pressed="'+(cur===o[0])+'" data-ans="'+esc(q.k)+'" data-v="'+esc(o[0])+'" data-num="'+(typeof o[0]==="number")+'">'+esc(o[1])+'</button>';
    }).join("")+'</div>'+
    (cur==="ns"?'<p class="note">Added to your questions for your agent.</p>':(q.why?'<p class="why">'+esc(q.why)+'</p>':''))+'</div>';
}
var MEMO='<p class="sub">Answer from memory. "Not sure" is fine. It becomes a question for your agent.</p>';
function policyScreen(title,sub,qs){
  return '<h2>'+esc(title)+'</h2>'+sub+qs.map(qBlock).join("")+
    '<div class="row spread foot">'+back()+'<button class="primary" data-act="next">Continue</button></div>';
}
function cacophony(){
  return '<div class="caco" aria-hidden="true">'+CACO.map(function(c){
    return '<span style="transform:rotate('+c[1]+'deg) translateY('+c[2]+'px)"><svg viewBox="0 0 24 24">'+ICONS[c[0]]+'</svg></span>';
  }).join("")+'</div>';
}
function usMap(){
  return '<div class="usmap" role="group" aria-label="Choose your state">'+GRID.map(function(t){
    return '<button style="grid-column:'+(t.x+1)+';grid-row:'+(t.y+1)+'" class="'+(t.key===S.state?'sel':'')+'" data-state="'+t.key+'" aria-label="'+STATE_NAMES[t.key]+'">'+t.key+'</button>';
  }).join("")+'</div>';
}

var openMore=false,openKnow=false,statusMsg="";
function render(){
  var o=order(); if(S.i>=o.length) S.i=o.length-1;
  var id=o[S.i],h="";
  bar.style.width=(S.i/(o.length-1)*100)+"%";
  if(id==="start"){
    h=cacophony()+
      '<h1>Find the gaps and double-payments in your insurance.</h1>'+
      '<p class="sub">About two minutes. No name, no email, no sales call.</p>'+
      '<ol class="steps"><li>Answer a few quick questions.</li><li>Tap the insurance you have.</li><li>Get a short list of what to fix and what to ask.</li></ol>'+
      '<p><b>You don\'t need your policies in front of you. Tap your state to start.</b></p>'+
      usMap()+
      '<p><label class="link" for="st">Or pick from a list</label> <select id="st" aria-label="State"><option value="">Choose a state…</option>'+STATES_BY_NAME.map(function(s){return '<option value="'+s+'"'+(s===S.state?' selected':'')+'>'+STATE_NAMES[s]+'</option>'}).join("")+'</select></p>'+
      '<p class="small">General information, not insurance advice. We\'re not an agent or broker. Nothing you enter leaves this page unless you share it.</p>';
  }
  if(id==="home"){
    h='<h2>Do you own or rent your home?</h2>'+single("home",[["Own","Own"],["Rent","Rent"],["Neither","Neither"]],S.home)+
      '<p class="why">Owners and renters need different coverage.</p><div class="row foot">'+back()+'</div>';
  }
  if(id==="dep"){
    h='<h2>Does anyone rely on your income?</h2><p class="sub">A partner, kids, or a parent you help support.</p>'+single("dep",[["Yes","Yes"],["No","No"]],S.dep)+
      '<p class="why">This decides whether life and disability coverage matter for you.</p><div class="row foot">'+back()+'</div>';
  }
  if(id==="car"){
    h='<h2>Do you have a car, truck, or van?</h2>'+single("car",[["Yes","Yes"],["No","No"]],S.car)+
      '<p class="why">If you drive, we\'ll check your auto policy.</p><div class="row foot">'+back()+'</div>';
  }
  if(id==="motor"){
    h='<h2>Anything else with a motor?</h2><p class="sub">Tap all that apply.</p>'+
      '<div class="chips">'+EXTRAS.map(function(x){var on=inList(S.extras,x);return '<button class="chip'+(on?' sel':'')+'" aria-pressed="'+on+'" data-x="'+x+'">'+x+'</button>'}).join("")+
      '<button class="chip" data-x="__none">None of these</button></div>'+
      '<p class="why">These are often less covered than people think.</p>'+
      '<div class="row spread foot">'+back()+(S.extras.length?'<button class="primary" data-act="next">Continue</button>':'')+'</div>';
  }
  if(id==="have"){
    h='<h2>Which of these do you have?</h2><p class="sub">Tap only the ones you\'re sure about.</p>'+
      '<div class="chips">'+haveList().map(function(x){var on=!!S.have[x[0]];return '<button class="chip'+(on?' sel':'')+'" aria-pressed="'+on+'" data-have="'+x[0]+'">'+esc(x[1])+'</button>'}).join("")+
      '<button class="chip" data-have="__none">None of these</button></div>'+
      '<p class="why">This is how we spot coverage you\'re missing or paying for twice.</p>'+
      '<div class="row spread foot">'+back()+'<button class="primary" data-act="next">Continue</button></div>';
  }
  if(id==="cushion"){
    h='<h2>Could you pay a $2,500 surprise bill from savings today?</h2>'+single("cushion",[["Yes","Yes"],["No","No"]],S.cushion)+
      '<p class="why">This tells us whether your deductibles fit your savings.</p><div class="row foot">'+back()+'</div>';
  }
  if(id==="assets"){
    h='<h2>'+(owns()?'If you sold your home today and added your savings, would it come to more than $300,000?':'Do you have more than $300,000 in savings and retirement accounts?')+'</h2>'+
      single("assets",[["Yes","Yes"],["No","No"],["ns","Not sure"]],S.assets)+
      '<p class="why">The more you own, the more a lawsuit could take.</p><div class="row foot">'+back()+'</div>';
  }
  if(id==="auto") h=policyScreen("Your auto policy",MEMO,autoQs());
  if(id==="home1"){var hq=homeQs(); h=policyScreen("Your home policy",MEMO,homeSplit()?hq.slice(0,2):hq)}
  if(id==="home2") h=policyScreen("A few more about your home",'<p class="sub">'+esc(stateName(S.state))+' has '+(inList(WINDSTATES,S.state)?'hurricane':'earthquake')+' rules that change what you\'d pay.</p>',homeQs().slice(2));
  if(id==="toys"){
    var names=S.extras.map(lc),title="Your "+listWords(names);
    h=policyScreen(title.charAt(0)+title.slice(1),'<p class="sub">Home and auto policies cover very little of these. "Not sure" is fine.</p>',toyQs());
  }
  if(id==="results"){
    var all=findings();
    var main=all.filter(function(f){return f.g!=="know"}),know=all.filter(function(f){return f.g==="know"});
    var front=main.slice(0,SHOW_UP_FRONT),rest=main.slice(SHOW_UP_FRONT);
    var cl=countLine(all);
    h='<div class="results"><h2>Your checkup</h2>'+(cl?'<p class="sub">'+esc(cl)+'</p>':'')+
      (main.length?grouped(front):know.length?'<p>Nothing urgent to fix. Here\'s what\'s worth knowing.</p>':'<p>Nothing stood out from your answers. If things change, like buying a car or a home, run the checkup again.</p>')+
      (rest.length?'<details class="more"'+(openMore?' open':'')+' data-d="more"><summary>Show '+rest.length+' more</summary><div class="stack">'+grouped(rest)+'</div></details>':'')+
      (know.length?'<details'+(openKnow||!main.length?' open':'')+' data-d="know"><summary>Good to know ('+know.length+')</summary><div class="stack">'+know.map(findHTML).join("")+'</div></details>':'')+
      '<div class="actions"><button data-act="share">Share my list</button><button data-act="copy">Copy my list</button><button data-act="print">Print my list</button></div>'+
      '<p class="status" role="status">'+esc(statusMsg)+'</p>'+
      '<div class="row spread noprint">'+back()+'<button class="link" data-act="restart">Start over</button></div>'+
      '<p class="small">General information, not insurance advice. We\'re not an agent or broker.</p></div>';
  }
  stage.innerHTML=h;
  if(DEBUG) tele();
}
function tele(){
  document.getElementById("debug").hidden=false;
  var total=(Date.now()-S.start)/1000;
  document.getElementById("tele").innerHTML=S.times.map(function(x){return "<tr><td>"+esc(x.s)+"</td><td>"+x.t.toFixed(1)+"s</td></tr>"}).join("")+"<tr><td><b>Total so far</b></td><td><b>"+total.toFixed(1)+"s</b></td></tr>";
}

function go(n){
  var o=order(); S.times.push({s:o[S.i],t:(Date.now()-S.t0)/1000}); S.t0=Date.now();
  S.i=Math.max(0,Math.min(n,order().length-1)); statusMsg=""; render(); window.scrollTo(0,0);
}
var moving=false;
function advance(){if(moving)return;moving=true;setTimeout(function(){moving=false;go(S.i+1)},160)}

function copyText(t){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")?res():rej()}catch(e){rej(e)}
    document.body.removeChild(ta);
  });
}
function setStatus(m){statusMsg=m;var el=stage.querySelector(".status");if(el)el.textContent=m}
function doCopy(){copyText(shareText(findings())).then(function(){setStatus("Copied. Paste it anywhere.")},function(){setStatus("Couldn't copy on this device. Try Print instead.")})}

stage.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.state){S.state=b.dataset.state;render();advance();return}
  if(b.dataset.set){
    var k=b.dataset.set,v=b.dataset.v,prev=S[k];S[k]=v;
    if(k==="home"&&prev!==v) S.have={};
    if(k==="dep"&&v==="No") delete S.have.dis;
    if(k==="car"&&v==="No"){delete S.have.club;delete S.ans.collDed;delete S.ans.roadside}
    render();advance();return}
  if(b.dataset.x){
    if(b.dataset.x==="__none"){S.extras=[];advance();return}
    var i=S.extras.indexOf(b.dataset.x);i>-1?S.extras.splice(i,1):S.extras.push(b.dataset.x);
    S.extras.sort(function(p,q){return EXTRAS.indexOf(p)-EXTRAS.indexOf(q)});
    render();return}
  if(b.dataset.have){
    if(b.dataset.have==="__none"){S.have={};render();advance();return}
    var hk=b.dataset.have;S.have[hk]=!S.have[hk];
    if(hk==="rentMine"&&S.have.rentMine) S.have.rentOther=false;
    if(hk==="rentOther"&&S.have.rentOther) S.have.rentMine=false;
    render();return}
  if(b.dataset.ans){
    var av=b.dataset.num==="true"?Number(b.dataset.v):b.dataset.v;
    S.ans[b.dataset.ans]=S.ans[b.dataset.ans]===av?undefined:av;
    var y=window.scrollY;render();window.scrollTo(0,y);return}
  var act=b.dataset.act;
  if(act==="back") go(S.i-1);
  if(act==="next") go(S.i+1);
  if(act==="restart"){S=fresh(S.state);openMore=openKnow=false;render();window.scrollTo(0,0)}
  if(act==="copy") doCopy();
  if(act==="share"){
    var t=shareText(findings());
    if(navigator.share) navigator.share({title:"My insurance checkup",text:t}).catch(function(err){if(err&&err.name!=="AbortError") doCopy()});
    else doCopy();
  }
  if(act==="print"){
    stage.querySelectorAll("details").forEach(function(d){d.open=true});
    window.print();
  }
});
stage.addEventListener("toggle",function(e){
  if(e.target.dataset&&e.target.dataset.d==="more") openMore=e.target.open;
  if(e.target.dataset&&e.target.dataset.d==="know") openKnow=e.target.open;
},true);
stage.addEventListener("change",function(e){
  if(e.target.id==="st"&&e.target.value){S.state=e.target.value;go(1)}
});
window.addEventListener("afterprint",function(){render()});
render();
})();
</script>
</body>
</html>
