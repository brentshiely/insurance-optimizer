<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Brent Shiely">
<title>Coverage Check Prototype</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <div class="brand"><b>Coverage Check</b><span>Prototype. Editable sample data. Nothing leaves this page.</span></div>
  <main class="card">
    <div class="bar"><i id="bar" style="width:0"></i></div>
    <div class="pad" id="stage" aria-live="polite"></div>
  </main>
  <aside>
    <div class="panel">
      <h3>What we know</h3>
      <dl id="known"></dl>
      <p class="small">No name. No address. No email.</p>
    </div>
    <div class="panel">
      <h3>Prototype telemetry</h3>
      <table id="tele"></table>
      <p class="small">Seconds per screen. This is the drop-off instrument.</p>
    </div>
  </aside>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
